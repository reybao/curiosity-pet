<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
  <meta name="theme-color" content="#fdf6ec">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <title>{{APP_NAME}}</title>
</head>
<body>
  <main id="app" data-state="off">
    <button id="lang" class="lang-toggle" type="button">EN</button>
    <!-- Skin picker: shows the current buddy; hidden when only the built-in kitten exists -->
    <button id="skin" class="skin-toggle" type="button" hidden><img alt=""></button>
    <div id="skin-sheet" class="skin-sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true">
        <p class="sheet-title"></p>
        <div class="skin-grid"></div>
      </div>
    </div>
    <section class="stage" aria-live="polite">
      <!-- The pet: a British Shorthair kitten. The collar light marks it as a program and changes
           color with state; the four states are driven by data-state on #app. -->
      <svg class="pet" viewBox="0 0 240 270" role="img" aria-label="Curiosity Buddy, a program kitten">
        <defs>
          <radialGradient id="fur-grad" cx="45%" cy="35%" r="70%">
            <stop offset="0" stop-color="var(--fur-hi)"/>
            <stop offset="1" stop-color="var(--fur)"/>
          </radialGradient>
          <radialGradient id="belly-grad" cx="50%" cy="40%" r="60%">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="var(--fur-light)"/>
          </radialGradient>
          <radialGradient id="iris-grad" cx="50%" cy="35%" r="65%">
            <stop offset="0" stop-color="var(--eye-hi)"/>
            <stop offset="1" stop-color="var(--eye)"/>
          </radialGradient>
        </defs>
        <g class="thinking-dots">
          <circle cx="186" cy="30" r="7"/>
          <circle cx="206" cy="18" r="7"/>
          <circle cx="226" cy="28" r="7"/>
        </g>
        <ellipse class="shadow" cx="120" cy="256" rx="58" ry="7"/>
        <g class="body">
          <path class="tail" d="M166 226 C204 228 224 206 212 176 C208 166 196 168 199 178 C206 198 192 212 164 214 Z"/>
          <ellipse class="fur" cx="120" cy="214" rx="54" ry="40"/>
          <ellipse class="belly" cx="120" cy="222" rx="32" ry="26"/>
          <ellipse class="paw" cx="98" cy="250" rx="17" ry="9"/>
          <ellipse class="paw" cx="142" cy="250" rx="17" ry="9"/>
          <g class="sound-rings">
            <path d="M22 100 q-14 28 0 56"/>
            <path d="M8 90 q-22 38 0 76"/>
            <path d="M218 100 q14 28 0 56"/>
            <path d="M232 90 q22 38 0 76"/>
          </g>
          <g class="head">
            <g class="ear left"><path class="fur" d="M46 98 Q40 34 92 62 Z"/><path class="ear-inner" d="M56 90 Q54 52 86 68 Z"/></g>
            <g class="ear right"><path class="fur" d="M194 98 Q200 34 148 62 Z"/><path class="ear-inner" d="M184 90 Q186 52 154 68 Z"/></g>
            <ellipse class="fur" cx="120" cy="116" rx="84" ry="74"/>
            <path class="tuft" d="M108 46 q6 -14 14 -4 q4 -12 12 2" />
            <ellipse class="muzzle" cx="120" cy="146" rx="34" ry="22"/>
            <g class="eyes">
              <g class="eye left">
                <ellipse class="iris" cx="88" cy="114" rx="18" ry="21"/>
                <ellipse class="pupil" cx="89" cy="116" rx="9" ry="14"/>
                <circle class="glint" cx="81" cy="105" r="6"/>
                <circle class="glint small" cx="96" cy="124" r="2.5"/>
              </g>
              <g class="eye right">
                <ellipse class="iris" cx="152" cy="114" rx="18" ry="21"/>
                <ellipse class="pupil" cx="153" cy="116" rx="9" ry="14"/>
                <circle class="glint" cx="145" cy="105" r="6"/>
                <circle class="glint small" cx="160" cy="124" r="2.5"/>
              </g>
            </g>
            <ellipse class="cheek" cx="58" cy="142" rx="13" ry="8"/>
            <ellipse class="cheek" cx="182" cy="142" rx="13" ry="8"/>
            <path class="nose" d="M114 136 h12 l-6 7 Z"/>
            <path class="mouth smile" d="M108 146 q6 8 12 0 q6 8 12 0"/>
            <ellipse class="mouth talk" cx="120" cy="150" rx="8" ry="7"/>
            <g class="whiskers left"><line x1="92" y1="140" x2="46" y2="132"/><line x1="92" y1="147" x2="44" y2="148"/><line x1="92" y1="154" x2="48" y2="164"/></g>
            <g class="whiskers right"><line x1="148" y1="140" x2="194" y2="132"/><line x1="148" y1="147" x2="196" y2="148"/><line x1="148" y1="154" x2="192" y2="164"/></g>
          </g>
          <rect class="collar" x="78" y="176" width="84" height="12" rx="6"/>
          <circle class="tag-ring" cx="120" cy="194" r="10"/>
          <circle class="tag-light" cx="120" cy="194" r="7"/>
        </g>
      </svg>
      <p id="status" class="status">点一下开始</p>
    </section>

    <section class="words">
      <p id="heard" class="heard"></p>
      <p id="answer" class="answer"></p>
    </section>

    <nav class="controls">
      <button id="mic" class="mic" type="button">
        <span class="mic-icon" aria-hidden="true"></span>
        <span class="mic-label">开始</span>
      </button>
    </nav>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
